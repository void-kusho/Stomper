[package]
name = "stomper"
version = "0.1.0"
edition = "2024"

[dependencies]
pcap = "1"
pnet_packet = "0.34"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
